<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .item-container {
            border: 1px solid red;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 30px;
            margin: 30px;
        }

        .items {
            border: 1px solid yellow;
            padding: 30px;
            width: 300px;
        }

        .items input {
            border: none;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            width: 90%;
        }

        button {
            border: none;
            padding: 10px 20px;
            background-color: red;
            color: black;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: white;
        }

        .inventory {
            margin: 30px;
            border: 1px solid white;
            padding: 20px;
        }

        .product {
            /* border: 1px solid gray; */
            padding: 15px;
            margin: 10px 0;
        }

        .low-stock {
            color: white;
            font-weight: bold;
        }

        .delete-btn {
            background-color: orange;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Inventory Management System</h1>

    <div class="item-container">


        <div class="items">

            <h3>Rice Management</h3>

            <input type="text" id="item-rice" placeholder="Enter product name">

            <input type="number" id="item-rice-stock" placeholder="Enter stock">

            <input type="number" id="item-rice-price" placeholder="Enter price">

            <br>

            <button id="btn-rice">Add Rice</button>

        </div>


        <div class="items">

            <h3>Soap Management</h3>

            <input type="text" id="item-soap" placeholder="Enter product name">

            <input type="number" id="item-soap-stock" placeholder="Enter stock">

            <input type="number" id="item-soap-price" placeholder="Enter price">

            <br>

            <button id="btn-soap">Add Soap</button>

        </div>

    </div>



    <div class="inventory">

        <h2>Inventory</h2>

        <div id="inventory-list"></div>

    </div>


    <script src="index.js"></script>

</body>

</html>
